<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="婦癌筆記">
<meta name="mobile-web-app-capable" content="yes">
<title>婦癌唸書筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<!-- 筆記內文的排版：匯出離線 HTML 時會連同這段一起帶走 -->
<style id="noteCss">
:root{
  --bg:#E8EDEB; --paper:#FFFFFF; --ink:#17201F; --muted:#5A6866; --line:#C9D3D0;
  --teal:#0A6A61; --teal-d:#07504A; --wash:#E1EDEA; --hl:#FFE873; --plum:#8B2A5E; --danger:#A3301F;
  --serif:"Source Serif 4","Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Source Sans 3","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
.doc{font:400 1rem/1.8 var(--sans);color:var(--ink);overflow-wrap:anywhere}
.doc h2{font:700 1.65rem/1.3 var(--serif);margin:0 0 .3rem}
.doc h3{font:700 1.2rem/1.4 var(--serif);margin:2.2rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--teal)}
.doc h4{font:600 1.03rem/1.5 var(--sans);margin:1.2rem 0 .3rem;color:var(--teal-d)}
.doc h5,.doc h6{font:600 .97rem/1.5 var(--sans);margin:1rem 0 .2rem}
.doc p{margin:.5rem 0}
.doc ul,.doc ol{margin:.3rem 0 .6rem;padding-left:1.35rem}
.doc li{margin:.12rem 0}
.doc li>ul,.doc li>ol{margin:.1rem 0 .2rem}
.doc .tw{overflow-x:auto;margin:.8rem 0}
.doc table{border-collapse:collapse;font-size:.93rem;line-height:1.55;min-width:60%}
.doc th,.doc td{border:1px solid var(--line);padding:.35rem .6rem;vertical-align:top;text-align:left}
.doc th{background:var(--wash);font-weight:600}
.doc code{font-size:.9em;background:var(--wash);padding:.05em .3em}
.doc blockquote{border-left:3px solid var(--plum);background:#F8EFF4;margin:.9rem 0;padding:.55rem .95rem;color:var(--ink)}
.doc blockquote strong{color:var(--plum)}
.doc hr{border:0;border-top:1px solid var(--line);margin:1.5rem 0}
.doc mark{background:var(--hl)}
/* 新文獻補充：螢光筆劃過的行 + 行尾的出處 */
.doc .hl{background:linear-gradient(transparent 58%,var(--hl) 58%)}
.doc a.cite{font:italic 400 .82rem/1 var(--serif);color:var(--plum);text-decoration:none;border-bottom:1px dotted var(--plum);margin-left:.35rem;white-space:nowrap;cursor:pointer}
.doc .src{color:var(--muted);font-size:.9rem;margin:0}
.doc .refs{font-size:.92rem}
.doc .refs li{margin:.5rem 0}
/* 我的標記筆記：我劃的重點／不熟、我的心得 */
.doc mark.my-hl{background:#CDEBD8;color:inherit;padding:0 1px}
.doc mark.my-st{background:#F9D3DF;color:inherit;padding:0 1px;box-shadow:inset 0 -2px 0 #B0245A}
.doc .mynote{border-left:3px solid var(--teal);background:#F2F8F6;padding:.45rem .95rem;margin:.5rem 0 1rem}
.doc .mynote h5,.doc .mynote h6{margin:.6rem 0 .2rem}
/* 依據出處：試驗或指引 */
.doc .ev{font-size:.8em;line-height:1.5;color:var(--teal-d);background:#EAF3F0;padding:.05rem .35rem;margin-left:.25rem;border-radius:2px}
.hide-ev .doc .ev{display:none}
/* 原書圖表 */
.doc figure.bookfig{margin:1.2rem 0;border:1px solid var(--line);background:#fff;padding:.6rem}
.doc figure.bookfig img{display:block;max-width:100%;height:auto;margin:0 auto .4rem;cursor:zoom-in}
.doc figure.bookfig figcaption{font-size:.86rem;line-height:1.5;color:var(--muted)}
.doc figure.bookfig.missing{color:var(--muted);font-size:.88rem}
/* 我的記號：綠＝劃重點，粉紅＝不熟，「註」＝有註記 */
.doc mark.ann{background:#CDEBD8;color:inherit;padding:0 1px;cursor:pointer}
.doc mark.ann.star{background:#F9D3DF;box-shadow:inset 0 -2px 0 #B0245A}
.doc .ann-chip{font:600 .7rem/1 var(--sans);color:#fff;background:var(--teal);padding:.12rem .3rem;margin-left:.2rem;cursor:pointer;vertical-align:super}
.doc .ann-note{font-size:.9rem;color:var(--teal-d);background:#E6F4EC;padding:0 .3rem;margin-left:.2rem}
@media (max-width:640px){
  .doc{line-height:1.75}
  .doc h2{font-size:1.4rem}
  .doc h3{font-size:1.12rem;margin-top:1.8rem}
  .doc ul,.doc ol{padding-left:1.15rem}
  .doc table{font-size:.88rem;min-width:100%}
  .doc th,.doc td{padding:.3rem .45rem}
  .doc a.cite{white-space:normal}
}
</style>

<style>
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:2rem;padding:.7rem 1.5rem 0}
.top h1{font:700 1.25rem/1.2 var(--serif);margin:0 0 .7rem;white-space:nowrap}
#tabs{display:flex;gap:1.4rem;overflow-x:auto}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.2rem 0 .65rem;color:var(--muted);white-space:nowrap}
#tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
#saved{margin-left:auto;font-size:.82rem;color:var(--muted);white-space:nowrap}

main{max-width:78rem;margin:0 auto;padding:1.5rem}
.paper{background:var(--paper);border:1px solid var(--line);padding:2.2rem 2.6rem}
.narrow{max-width:54rem;margin:0 auto}
h2.vt{font:700 1.5rem/1.3 var(--serif);margin:0 0 .3rem}
.lead{color:var(--muted);margin:0 0 1.4rem;max-width:44rem}
h3.st{font:700 1.08rem/1.4 var(--serif);margin:2rem 0 .6rem;padding-top:1rem;border-top:1px solid var(--line)}
.muted{color:var(--muted)} .small{font-size:.88rem}

.btn{background:var(--paper);border:1px solid var(--ink);padding:.4rem .9rem;border-radius:2px}
.btn:hover{background:var(--wash)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--teal-d);text-decoration:underline;text-underline-offset:2px}
.link.danger{color:var(--danger)}
.row{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
label.f{display:block;margin:.9rem 0 .25rem;font-weight:600}
input[type=text],input[type=password],input[type=search],input[type=number],select,textarea{border:1px solid var(--line);background:#fff;padding:.4rem .55rem;border-radius:2px;max-width:100%}
input[type=text],input[type=password],textarea{width:100%}
textarea{line-height:1.6;resize:vertical}
.chk{display:inline-flex;gap:.4rem;align-items:center}

.drop{border:2px dashed var(--line);padding:2rem 1rem;text-align:center;color:var(--muted);background:#FAFCFB}
.drop.over{border-color:var(--teal);background:var(--wash);color:var(--ink)}

/* 筆記頁 */
.notes{display:grid;grid-template-columns:17.5rem minmax(0,1fr);gap:1.5rem;align-items:start}
.side{position:sticky;top:4.2rem;max-height:calc(100vh - 5.5rem);overflow:auto;font-size:.95rem}
.side input[type=search]{width:100%}
.bk{margin-top:1.1rem}
.bk-t{font:700 .98rem/1.4 var(--serif);display:flex;justify-content:space-between;gap:.5rem;border-bottom:1px solid var(--line);padding-bottom:.25rem}
.bk ul{list-style:none;margin:.3rem 0 0;padding:0}
.bk li button{display:flex;justify-content:space-between;gap:.5rem;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:.28rem .5rem;line-height:1.4}
.bk li button:hover{background:rgba(10,106,97,.08)}
.bk li button[aria-current="true"]{border-left-color:var(--teal);background:var(--paper);font-weight:600}
.cnt{font:italic .8rem var(--serif);color:var(--plum);white-space:nowrap}
.ch-tools{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin:.5rem 0 0;font-size:.88rem}
.sec>h3{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.sec>h3 .link{font:400 .82rem var(--sans);flex:none}
.sec-edit input{font-weight:600;margin-bottom:.4rem}
.sec-edit textarea{min-height:16rem;font-size:.92rem}
mark.q{background:#BFE3DC}
/* 小節目錄與閱讀進度 */
.toc{border:1px solid var(--line);background:#FAFCFB;padding:.8rem 1rem;margin:1.2rem 0 .4rem}
.toc-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;font-weight:600;margin-bottom:.4rem}
.toc-h .small{font-weight:400}
.toc ol{list-style:none;margin:0;padding:0;columns:2 17rem;column-gap:1.5rem}
.toc li{display:flex;align-items:flex-start;gap:.45rem;break-inside:avoid;padding:.12rem 0}
.toc li .go{background:none;border:0;padding:.15rem 0;text-align:left;color:var(--teal-d);line-height:1.45;cursor:pointer}
.toc li .go:hover{text-decoration:underline}
.toc li.p2 .go{color:var(--muted)}
.pg{flex:none;font:600 .74rem/1 var(--sans);border:1px solid var(--teal);color:var(--teal-d);background:#fff;padding:.28rem .4rem;cursor:pointer;min-width:2.9rem;border-radius:2px}
.pg.p1{background:#E2F0EC}
.pg.p2{background:var(--teal);color:#fff}
.sec,.doc h3[id]{scroll-margin-top:5rem}
.sec>h3 .h3tools{display:flex;gap:.8rem;align-items:baseline;flex:none}
.prog{display:block;font:400 .74rem var(--sans);color:var(--muted);margin-top:.1rem}
.prog.done{color:var(--teal-d)}
@media (max-width:820px){.sec,.doc h3[id]{scroll-margin-top:3.6rem}.toc ol{columns:1}.pg{min-height:2.2rem;min-width:3.2rem}.toc li .go{padding:.45rem 0}}
#annBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom));z-index:9;background:var(--ink);color:#fff;display:flex;gap:.3rem;align-items:center;padding:.35rem;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:calc(100vw - 1rem)}
#annBar[hidden]{display:none}
/* 複習卡片 */
.rev-bar{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin-bottom:1rem}
.rev-card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--teal);padding:1.3rem 1.5rem;min-height:14rem}
.rev-card.st{border-top-color:#B0245A}.rev-card.mn{border-top-color:var(--plum)}.rev-card.qr{border-top-color:#C9A227}
.rev-meta{font-size:.85rem;color:var(--muted);margin:0 0 .7rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.rev-card .doc{font-size:1.08rem}
.rev-nav{display:flex;justify-content:space-between;gap:.6rem;margin:1rem 0;flex-wrap:wrap}
.rev-nav .btn{min-width:6.5rem}
.rev-count{font:600 .95rem var(--sans);color:var(--muted);align-self:center}
@media (max-width:820px){.rev-card{padding:1rem .9rem;min-height:12rem}.rev-nav .btn{flex:1;min-width:0}}
#annBar button{background:none;border:0;color:#fff;padding:.55rem .75rem;white-space:nowrap;min-height:2.75rem}
#annBar button:hover{background:rgba(255,255,255,.12)}
#annBar .sw{display:inline-block;width:.8rem;height:.8rem;margin-right:.35rem;vertical-align:-.05rem}
.ann-list{list-style:none;padding:0;margin:.5rem 0 0;max-height:60vh;overflow:auto}
.ann-list li{border-top:1px solid var(--line);padding:.6rem 0}
.ann-list .q{display:block;margin:.15rem 0}
.ann-list .q.star{background:#F9D3DF}.ann-list .q.hl{background:#CDEBD8}
.ann-filter{display:flex;gap:1rem;flex-wrap:wrap}
.flash{outline:3px solid var(--plum);outline-offset:2px}

/* 表格式清單 */
table.grid{border-collapse:collapse;width:100%;font-size:.94rem}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:middle}
table.grid th{font-weight:600;color:var(--muted);font-size:.85rem}
table.grid input[type=number]{width:5rem}
table.grid td.st-ok{color:var(--teal-d)} table.grid td.st-err{color:var(--danger)}

/* 文獻比對 */
.paper-res{border-top:2px solid var(--ink);margin-top:2rem;padding-top:1rem}
.paper-res h4{font:700 1.08rem/1.4 var(--serif);margin:0 0 .3rem}
.item{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.2rem .5rem;align-items:start;padding:.9rem 0;border-top:1px solid var(--line)}
.item>.tap{margin-top:.5rem}
.tap{display:inline-flex;align-items:center;justify-content:center}
.pair{display:inline-flex;align-items:center;gap:.5rem;min-width:0;max-width:100%}
.pair select{min-width:0;max-width:100%;text-overflow:ellipsis}
.item textarea{font-size:.92rem;min-height:5rem;margin-top:.4rem}
.item select{font-size:.88rem;max-width:100%}
.rel{font-weight:600;margin-right:.6rem}
.rel.update,.rel.conflict{color:var(--plum)} .rel.covered{color:var(--muted)} .rel.new{color:var(--teal-d)}

#status{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:#fff;padding:.6rem 1.5rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;font-size:.92rem}
#status[hidden]{display:none}
#status button{background:none;border:1px solid #fff;color:#fff;padding:.15rem .8rem;border-radius:2px}
#toast{position:fixed;left:50%;bottom:4rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;font-size:.92rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
dialog{border:1px solid var(--ink);padding:1.5rem 1.8rem;max-width:min(40rem,92vw);border-radius:2px}
dialog::backdrop{background:rgba(23,32,31,.45)}
dialog h3{font:700 1.1rem/1.4 var(--serif);margin:0 0 .6rem}

/* 筆記頁的章節切換鈕：只在窄螢幕出現 */
.tree-toggle{display:none}
#status{padding-bottom:calc(.6rem + env(safe-area-inset-bottom))}

@media (max-width:820px){
  /* 標題列捲走，只留分頁列黏在上面 */
  .top{flex-direction:column;align-items:stretch;gap:0;padding:.35rem .9rem 0;top:-2.25rem;padding-left:max(.9rem,env(safe-area-inset-left));padding-right:max(.9rem,env(safe-area-inset-right))}
  .top h1{font-size:1rem;line-height:1.9rem;height:1.9rem;margin:0}
  #saved{display:none}
  #tabs{gap:0;justify-content:space-between;overflow-x:visible}
  #tabs button{padding:.7rem .15rem .6rem;min-height:2.75rem}
  main{padding:.7rem .7rem 5rem;padding-left:max(.7rem,env(safe-area-inset-left));padding-right:max(.7rem,env(safe-area-inset-right))}
  .paper{padding:1.2rem 1rem 1.6rem}
  h2.vt{font-size:1.3rem}
  /* iOS 在小於 16px 的輸入框會自動放大畫面 */
  input[type=text],input[type=password],input[type=search],input[type=number],select,textarea{font-size:16px}
  input[type=text],input[type=password],input[type=search],input[type=number],select{min-height:2.75rem}
  input[type=checkbox],input[type=radio]{width:1.25rem;height:1.25rem;flex:none}
  .btn{padding:.65rem 1rem;min-height:2.75rem}
  .link{padding:.7rem .15rem;min-height:2.75rem}
  .chk{min-height:2.75rem}
  .drop{padding:1.6rem .8rem}
  /* 筆記頁：章節清單收合成一顆切換鈕 */
  .notes{grid-template-columns:minmax(0,1fr);gap:.7rem}
  .side{position:static;max-height:none;overflow:visible}
  .tree-toggle{display:flex;justify-content:space-between;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--paper)}
  .tree-toggle b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-toggle span{flex:none;color:var(--teal-d);font-size:.9rem}
  .side-body{display:none;background:var(--paper);border:1px solid var(--line);border-top:0;padding:.8rem}
  .side.open .side-body{display:block}
  #tree{max-height:52vh;overflow:auto}
  .bk li button{padding:.65rem .5rem}
  .ch-tools{gap:0 1.2rem}
  .sec-edit textarea{min-height:45vh}
  /* 文獻提案：位置選單各佔一行 */
  .item{grid-template-columns:1.6rem minmax(0,1fr)}
  .item select{display:block;width:100%;margin-top:.4rem}
  .item>.tap{margin-top:-.55rem}
  .tap{min-width:2.75rem;min-height:2.75rem;margin:-.75rem -.6rem}
  .pair{flex:1 1 100%}
  .pair select{flex:1;min-width:0}
  dialog{padding:1.2rem 1.1rem}
  #toast{bottom:calc(4.5rem + env(safe-area-inset-bottom));width:max-content}
}
@media (max-width:640px){
  /* 表格式清單在手機改成直排 */
  table.stack thead{display:none}
  table.stack,table.stack tbody{display:block}
  table.stack tr{display:grid;gap:.4rem .6rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
  table.stack td{border:0;padding:0}
  #rows tr{grid-template-columns:1.6rem minmax(0,1fr) minmax(0,1fr)}
  #rows td:nth-child(2){grid-column:2/4}
  #rows td:nth-child(3){grid-column:2}
  #rows td:nth-child(4){grid-column:3}
  #rows td:nth-child(5){grid-column:2/4}
  #rows td:nth-child(5):empty{display:none}
  #rows td[data-l]{display:flex;align-items:center;gap:.4rem}
  #rows td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:.85rem;flex:none}
  #rows input[type=number]{width:100%;min-width:0}
  .srcs tr{grid-template-columns:minmax(0,1fr) auto}
  .srcs td:nth-child(1){grid-column:1/3}
  .srcs td:nth-child(3){display:none}
}
@media (max-width:440px){
  #tabs .lg{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{
  .top,.side,#status,#toast,.ch-tools,.sec>h3 .link,.noprint{display:none!important}
  body{background:#fff} main{padding:0;max-width:none} .notes{display:block} .paper{border:0;padding:0}
  .doc{font-size:10.5pt;line-height:1.6} .doc h3{break-after:avoid} .doc table{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <h1>婦癌唸書筆記</h1>
  <nav id="tabs" aria-label="主要功能">
    <button data-act="tab" data-tab="notes">筆記</button>
    <button data-act="tab" data-tab="book"><span class="lg">匯入</span>電子書</button>
    <button data-act="tab" data-tab="lit"><span class="lg">加入</span>新文獻</button>
    <button data-act="tab" data-tab="exam">考試<span class="lg">筆記</span></button>
    <button data-act="tab" data-tab="rev">複習</button>
    <button data-act="tab" data-tab="set">設定</button>
  </nav>
  <span id="saved"></span>
</header>
<main id="main"></main>
<div id="annBar" hidden role="toolbar" aria-label="替選取的文字做記號"><button data-act="annAdd" data-kind="hl"><span class="sw" style="background:#CDEBD8"></span>劃重點</button><button data-act="annAdd" data-kind="star"><span class="sw" style="background:#F9D3DF"></span>不熟</button><button data-act="annAdd" data-kind="note">加註記</button><button data-act="annList">我的記號</button></div>
<div id="status" hidden><span id="statusText"></span><button data-act="stop">停止</button></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<input type="file" id="filePick" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
/* ========== 基本工具 ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ========== Markdown → HTML（輸入一律先 escape） ========== */
function inlineMd(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>');
  s=s.replace(/==([^=]+)==/g,'<mark>$1</mark>');
  s=s.replace(/\{\+([\s\S]+?)\+\}/g,'<mark class="my-hl">$1</mark>').replace(/\{!([\s\S]+?)!\}/g,'<mark class="my-st">$1</mark>');
  return s;
}
function lineMd(raw){
  const ids=[];const rest=raw.replace(/\s*\[\^(S\d+)\]/g,(m,id)=>{ids.push(id);return '';});
  let h=inlineMd(rest).replace(/〔依據：([^〕]+)〕/g,'<span class="ev">依據：$1</span>');
  if(ids.length){h='<span class="hl">'+h+'</span>'+[...new Set(ids)].map(id=>{const s=getSrc(id);return '<a class="cite" data-src="'+id+'" href="#src-'+id+'">'+esc(s?s.short:id)+'</a>';}).join('');}
  return h;
}
const RE_LIST=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const isTableRow=l=>/^\s*\|.*\|\s*$/.test(l);
const isTableSep=l=>/^\s*\|?[\s:|-]+\|?\s*$/.test(l)&&l.includes('-');
const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
function mdRender(src){
  const L=String(src||'').replace(/\r/g,'').split('\n');let out='',i=0,m;
  const blockStart=k=>L[k].trim()===':::note'||/^#{1,6}\s/.test(L[k])||RE_LIST.test(L[k])||/^\s*>/.test(L[k])||(isTableRow(L[k])&&k+1<L.length&&isTableSep(L[k+1]));
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue;}
    if(l.trim()===':::note'){const b=[];i++;while(i<L.length&&L[i].trim()!==':::'){b.push(L[i]);i++;}i++;out+='<div class="mynote">'+mdRender(b.join('\n'))+'</div>';continue;}
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){const n=Math.min(6,Math.max(3,m[1].length+1));out+='<h'+n+'>'+lineMd(m[2])+'</h'+n+'>';i++;continue;}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out+='<hr>';i++;continue;}
    if((m=l.match(/^\s*!\[([^\]]*)\]\(fig:([\w.-]+)\)\s*$/))){const f=(S.figs||{})[m[2]];out+=f&&f.src&&f.src.length?'<figure class="bookfig" data-fig="'+esc(m[2])+'">'+f.src.map((u,k)=>'<img src="'+esc(u)+'" alt="'+esc(m[1])+(f.src.length>1?'（'+(k+1)+'/'+f.src.length+'）':'')+'" loading="lazy">').join('')+'<figcaption>'+inlineMd(m[1])+'</figcaption></figure>':'<figure class="bookfig missing">［圖表未匯入：'+inlineMd(m[1])+'］</figure>';i++;continue;}
    if(isTableRow(l)&&i+1<L.length&&isTableSep(L[i+1])){
      out+='<div class="tw"><table><thead><tr>'+cells(l).map(c=>'<th>'+lineMd(c)+'</th>').join('')+'</tr></thead><tbody>';i+=2;
      while(i<L.length&&isTableRow(L[i])){out+='<tr>'+cells(L[i]).map(c=>'<td>'+lineMd(c)+'</td>').join('')+'</tr>';i++;}
      out+='</tbody></table></div>';continue;
    }
    if(RE_LIST.test(l)){
      const st=[];
      while(i<L.length&&(m=L[i].match(RE_LIST))){
        const ind=m[1].replace(/\t/g,'  ').length,ord=/\d/.test(m[2]);
        while(st.length&&ind<st[st.length-1].ind)out+='</li></'+st.pop().tag+'>';
        if(!st.length||ind>st[st.length-1].ind){const tag=ord?'ol':'ul';out+='<'+tag+'>';st.push({ind,tag});}else out+='</li>';
        out+='<li>'+lineMd(m[3]);i++;
      }
      while(st.length)out+='</li></'+st.pop().tag+'>';continue;
    }
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++;}out+='<blockquote>'+b.map(lineMd).join('<br>')+'</blockquote>';continue;}
    const p=[l];i++;while(i<L.length&&L[i].trim()&&!blockStart(i)){p.push(L[i]);i++;}
    out+='<p>'+p.map(lineMd).join('<br>')+'</p>';
  }
  return out;
}
function cleanMd(t){return String(t||'').trim().replace(/^```(?:markdown|md)?\s*\n/i,'').replace(/\n```\s*$/,'').trim();}
function splitSections(text){
  const secs=[],pre=[];let cur=null;
  for(const l of cleanMd(text).split('\n')){
    const m=l.match(/^##\s+(.*)$/);
    if(m){cur={heading:m[1].trim(),lines:[]};secs.push(cur);}
    else if(/^#\s+/.test(l))continue;
    else (cur?cur.lines:pre).push(l);
  }
  if(pre.join('').trim())secs.unshift({heading:'概要',lines:pre});
  return secs.map(s=>({heading:s.heading,md:s.lines.join('\n').trim()}));
}
function parseJSON(t){
  t=String(t).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(t);}catch(e){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e2){}}throw new Error('模型回傳的內容不是完整的 JSON（可能被截斷），請重試一次');}
}

/* ========== Gemini API ========== */
const API='https://generativelanguage.googleapis.com/v1beta';
const FALLBACK=['gemini-3.1-pro-preview','gemini-3.1-pro','gemini-pro-latest'];
const USAGE={in:0,out:0,model:''};
const JOB={ctrl:null};
let OKMODEL=null; // 這次開啟期間實際可用的模型，避免每次都先撞一次 404
function setStatus(t){$('#status').hidden=!t;$('#statusText').textContent=t||'';}
async function runJob(fn){
  if(JOB.ctrl){toast('上一個工作還在進行，請等它完成或按「停止」');return;}
  if(!CFG.apiKey){toast('先到「設定」填入 Gemini API key');go('set');return;}
  JOB.ctrl=new AbortController();
  let lock=null;try{lock=await navigator.wakeLock?.request('screen');}catch(e){} // 手機螢幕一關，進行中的請求會被系統中斷
  try{await fn(JOB.ctrl.signal);}
  catch(e){if(e.name==='AbortError')toast('已停止');else{console.error(e);toast(e.message||String(e),8000);}}
  finally{JOB.ctrl=null;setStatus('');save();try{await lock?.release();}catch(e){}}
}
async function apiError(res){let msg='';try{const j=await res.json();msg=j.error?.message||JSON.stringify(j);}catch(e){try{msg=await res.text();}catch(e2){}}return msg;}
async function gemini(o){
  const chain=[OKMODEL||CFG.model,...FALLBACK].filter((m,i,a)=>m&&a.indexOf(m)===i);let last;
  for(const model of chain){
    try{const r=await callModel(model,o);OKMODEL=model;return r;}
    catch(e){if(e.status===404){last=e;continue;}throw e;}
  }
  throw new Error('找不到可用的模型（'+chain.join('、')+'）。到「設定」按「列出可用模型」挑一個。'+(last?' '+last.message:''));
}
async function callModel(model,o){
  let useThinking=/gemini-3|latest/.test(model),useMax=true;
  for(let attempt=0;;attempt++){
    const gc={};
    if(useMax)gc.maxOutputTokens=65536;
    if(o.json){gc.responseMimeType='application/json';if(o.schema)gc.responseSchema=o.schema;}
    if(useThinking)gc.thinkingConfig={thinkingLevel:o.thinking||CFG.thinking};
    const body={contents:[{role:'user',parts:o.parts}],generationConfig:gc};
    if(o.system)body.systemInstruction={parts:[{text:o.system}]};
    const res=await fetch(API+'/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':CFG.apiKey},body:JSON.stringify(body),signal:o.signal});
    if(!res.ok){
      const msg=await apiError(res);
      if(res.status===400&&useThinking&&/thinking/i.test(msg)){useThinking=false;continue;}
      if(res.status===400&&useMax&&/max.?output/i.test(msg)){useMax=false;continue;}
      if([429,500,503].includes(res.status)&&attempt<3){const s=[10,25,60][attempt];setStatus('Gemini 暫時忙線（'+res.status+'），'+s+' 秒後自動重試');await wait(s*1000,o.signal);continue;}
      const hint=res.status===429?'用量已達上限，稍後再試或檢查帳單方案。':(res.status===400&&/API key/i.test(msg))||res.status===403?'API key 無效或沒有這個模型的權限。':'';
      const e=new Error('Gemini 回覆錯誤 '+res.status+'：'+hint+msg.slice(0,300));e.status=res.status;throw e;
    }
    let text='',finish='',block='',usage=null;
    const handle=j=>{
      if(j.error)throw new Error('Gemini 回覆錯誤：'+(j.error.message||''));
      if(j.promptFeedback?.blockReason)block=j.promptFeedback.blockReason;
      const c=j.candidates?.[0];
      if(c){for(const p of c.content?.parts||[])if(p.text&&!p.thought)text+=p.text;if(c.finishReason)finish=c.finishReason;}
      if(j.usageMetadata)usage=j.usageMetadata;
      o.onText?.(text);
    };
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    const feed=line=>{line=line.replace(/\r$/,'');if(line.startsWith('data:')){const d=line.slice(5).trim();if(d&&d!=='[DONE]')handle(JSON.parse(d));}};
    for(;;){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let k;while((k=buf.indexOf('\n'))>=0){feed(buf.slice(0,k));buf=buf.slice(k+1);}}
    if(buf.trim())feed(buf);
    if(usage){USAGE.in+=usage.promptTokenCount||0;USAGE.out+=(usage.candidatesTokenCount||0)+(usage.thoughtsTokenCount||0);}
    USAGE.model=model;
    if(block)throw new Error('這份內容被 Gemini 的安全過濾擋下（'+block+'）');
    if(!text.trim())throw new Error('Gemini 沒有產出內容'+(finish?'（'+finish+'）':'')+(finish==='RECITATION'?'：內容過於接近原文而被中止，改用較精簡的詳略度再試':''));
    return {text,model,finish,truncated:finish==='MAX_TOKENS'};
  }
}
function toB64(bytes){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result.slice(fr.result.indexOf(',')+1));fr.onerror=()=>rej(fr.error);fr.readAsDataURL(new Blob([bytes]));});}
const INLINE_MAX=14*1024*1024, FILE_MAX=50*1024*1024;
async function filePart(bytes,mime,name,signal){
  if(bytes.byteLength>FILE_MAX)throw new Error('「'+name+'」超過 Gemini 單檔 50MB 上限，請把頁數範圍切小一點，或改用文字模式');
  if(bytes.byteLength<=INLINE_MAX)return {inlineData:{mimeType:mime,data:await toB64(bytes)}};
  setStatus('檔案較大，先上傳到 Gemini（'+(bytes.byteLength/1048576).toFixed(1)+' MB）');
  const start=await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files',{method:'POST',signal,headers:{'x-goog-api-key':CFG.apiKey,'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(bytes.byteLength),'X-Goog-Upload-Header-Content-Type':mime,'Content-Type':'application/json'},body:JSON.stringify({file:{display_name:name}})});
  if(!start.ok)throw new Error('上傳失敗 '+start.status+'：'+(await apiError(start)).slice(0,200));
  const url=start.headers.get('x-goog-upload-url');
  if(!url)throw new Error('上傳失敗：瀏覽器拿不到上傳網址。請把頁數範圍切小（單章 14MB 以下會直接內嵌傳送）或改用文字模式');
  const up=await fetch(url,{method:'POST',signal,headers:{'X-Goog-Upload-Offset':'0','X-Goog-Upload-Command':'upload, finalize'},body:new Blob([bytes],{type:mime})});
  if(!up.ok)throw new Error('上傳失敗 '+up.status);
  let f=(await up.json()).file;
  for(let i=0;f.state==='PROCESSING'&&i<90;i++){await wait(2000,signal);f=await (await fetch(API+'/'+f.name,{headers:{'x-goog-api-key':CFG.apiKey},signal})).json();}
  if(f.state==='FAILED')throw new Error('Gemini 無法處理這個檔案');
  return {fileData:{mimeType:f.mimeType||mime,fileUri:f.uri}};
}

async function flattenOutline(pdf,items,depth,out=[]){
  for(const it of items){
    let page=null;
    try{let d=it.dest;if(typeof d==='string')d=await pdf.getDestination(d);if(Array.isArray(d)&&d[0]!=null)page=typeof d[0]==='object'?(await pdf.getPageIndex(d[0]))+1:Number(d[0])+1;}catch(e){}
    if(page)out.push({title:(it.title||'').replace(/\s+/g,' ').trim(),start:page,depth,leaf:!(it.items&&it.items.length)});
    if(it.items&&it.items.length&&depth<2)await flattenOutline(pdf,it.items,depth+1,out);
  }
  return out;
}
function rowsFromOutline(bk,level){
  bk.level=level;
  const pick=bk.outline.filter(o=>o.depth===level||(o.depth<level&&o.leaf)).sort((a,b)=>a.start-b.start);
  bk.rows=pick.map((o,i)=>({on:true,title:o.title,start:o.start,end:Math.max(o.start,(i+1<pick.length?pick[i+1].start-1:bk.n)),status:''}));
}
function xmlText(node){
  let out='';const BLOCK=/^(p|div|h[1-6]|li|tr|br|section|blockquote|figcaption|table|dt|dd)$/i;

  return out.replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n').trim();
}
async function openEpub(bk){

    const ol=navEl&&[...navEl.children].find(c=>c.localName==='ol');if(ol)walk(ol,0);
  }
  if(!bk.outline.length&&ncx){const d=P.parseFromString(await read(ncx.href),'application/xml');const dir=ncx.href.includes('/')?ncx.href.slice(0,ncx.href.lastIndexOf('/')+1):'';

function tagLines(text,srcId,relation){
  let ls=String(text||'').replace(/\r/g,'').split('\n').filter(l=>l.trim()&&!/^\s*\|/.test(l)&&!/^#+\s/.test(l));
  if(!ls.length)return [];
  ls=ls.map(l=>RE_LIST.test(l)?l.replace(/\t/g,'  '):'- '+l.trim());
  const min=Math.min(...ls.map(l=>l.match(/^\s*/)[0].length));ls=ls.map(l=>l.slice(min));
  const label={update:'**〔更新〕** ',conflict:'**〔與原筆記不同〕** '}[relation]||'';
  return ls.map((l,i)=>{if(i===0&&label)l=l.replace(/^(\s*(?:[-*+]|\d+[.)])\s+)/,'$1'+label);return l.replace(/\s+$/,'').replace(/\s*\[\^S\d+\]/g,'')+' [^'+srcId+']';});
}
function insertLines(md,add,anchor){
  const lines=md?md.split('\n'):[];
  const norm=s=>s.replace(/\[\^S\d+\]/g,'').replace(/^\s*([-*+]|\d+[.)])\s+/,'').replace(/[*`=]/g,'').replace(/\s+/g,' ').trim();
  let at=-1;
  if(anchor){const a=norm(anchor);if(a.length>=4){at=lines.findIndex(l=>norm(l)===a);if(at<0)at=lines.findIndex(l=>{const n=norm(l);return n&&(n.includes(a)||(n.length>=12&&a.includes(n)));});}}
  if(at<0)return (md&&md.trim()?md.replace(/\s+$/,'')+'\n':'')+add.join('\n');
  const ind=l=>l.match(/^\s*/)[0].length,base=ind(lines[at]),tbl=/^\s*\|/.test(lines[at]),isLi=RE_LIST.test(lines[at]);
  let end=at+1;
  if(tbl){while(end<lines.length&&/^\s*\|/.test(lines[end]))end++;}
  else if(isLi){while(end<lines.length&&lines[end].trim()&&ind(lines[end])>base)end++;}
  const ins=add.map(l=>(isLi?' '.repeat(base):'')+l);
  if(!isLi){ins.unshift('');if(end<lines.length&&lines[end].trim())ins.push('');}
  lines.splice(end,0,...ins);
  return lines.join('\n');
}
function applyPaper(q){
  const items=q.result.items.filter(it=>it.on&&it.text.trim());
  if(!items.length){toast('沒有勾選任何項目');return;}
  UNDO={state:JSON.stringify(S),qid:q.id};
  const cit=q.result.citation;
  const src={id:'S'+(++S.seq.s),short:cit.short,title:cit.title||'',authors:cit.authors||'',journal:cit.journal||'',year:cit.year||'',design:cit.design||'',doi:cit.doi||'',summary:q.result.summary||'',limitations:q.result.limitations||'',file:q.name,addedAt:today(),n:items.length};
  S.sources.push(src);
  for(const it of items){
    let c=getCh(it.chapterId);
    if(!c){
      const bt='期刊新知（未歸類）';const b=S.books.find(x=>x.title===bt)||addBook(bt);
      const ct=(it.newChapterTitle||'未分類').trim();c=chaptersOf(b).find(x=>x.title===ct)||addChapter(b,ct,'');
    }
    let s=c.sections.find(x=>x.id===it.sectionId);
    if(!s){const h=(it.newHeading||'新文獻補充').trim();s=c.sections.find(x=>x.heading===h)||addSection(c,h,'',true);}
    s.md=insertLines(s.md,tagLines(it.text,src.id,it.relation),it.anchor);
    c.rev=Date.now();it.placed=c.id;
  }
  q.applied=true;q.srcId=src.id;save();
  toast('已把 '+items.length+' 項加入筆記');
}
function removeSource(id){
  for(const c of S.chapters){let hit=false;for(const s of c.sections){const kept=s.md.split('\n').filter(l=>!l.includes('[^'+id+']'));if(kept.length!==s.md.split('\n').length){s.md=kept.join('\n').replace(/\n{3,}/g,'\n\n').trim();hit=true;}}if(hit){c.sections=c.sections.filter(s=>s.md.trim());c.rev=Date.now();}}
  const ub=S.books.find(b=>b.title==='期刊新知（未歸類）');
  if(ub){S.chapters=S.chapters.filter(c=>c.bookId!==ub.id||c.sections.length);if(!chaptersOf(ub).length)S.books=S.books.filter(b=>b!==ub);}
  S.sources=S.sources.filter(s=>s.id!==id);save();
}

function newExam(name){const e={id:'E'+(++S.seq.e),name:name||'新的考試',scope:PRESETS[name]||'',formats:{key:true,table:true,pitfall:true,oral:false,mcq:false},level:'standard',chapterIds:allChapters().map(c=>c.id),notes:{}};S.exams.push(e);return e;}
const getExam=()=>S.exams.find(e=>e.id===UI.examId);
const examState=(e,c)=>{const n=e.notes[c.id];return !n?'未產生':n.rev!==c.rev?'母本已更新，需重新產生':'已產生';};
async function genExam(all,signal){
  const e=getExam();readExamForm();
  if(!Object.values(e.formats).some(Boolean)){toast('至少勾選一種筆記型式');return;}
  const list=e.chapterIds.map(getCh).filter(Boolean).filter(c=>c.sections.length&&(all||examState(e,c)!=='已產生'));
  if(!list.length){toast(e.chapterIds.length?'所有章節都已是最新':'先勾選要納入的章節');return;}
  let k=0;
  for(const c of list){
    const label='產生「'+e.name+'」筆記：'+c.title+'（'+(++k)+' / '+list.length+'）';setStatus(label);const t0=Date.now();
    const r=await gemini({parts:[{text:'【母本筆記】\n'+chapterMd(c)},{text:examPrompt(e,bookTitle(c),c.title)}],system:SYS,signal,onText:t=>setStatus(label+'：已寫 '+t.length+' 字，'+Math.round((Date.now()-t0)/1000)+' 秒')});
    e.notes[c.id]={md:cleanMd(r.text),rev:c.rev,at:today()};save();
    if(UI.tab==='exam')renderExam();
  }
  toast('考試筆記已產生');
}
const examChapters=e=>allChapters().filter(c=>e.chapterIds.includes(c.id)&&e.notes[c.id]&&!/^（本章不在此考試範圍內）/.test(e.notes[c.id].md.trim()));

/* ========== 匯出 ========== */
function usedSources(text){const ids=[...new Set((text.match(/\[\^S\d+\]/g)||[]).map(x=>x.slice(2,-1)))];return ids.map(getSrc).filter(Boolean);}
const srcLine=s=>[s.authors,s.title,[s.journal,s.year].filter(Boolean).join(' '),s.doi].filter(Boolean).join('. ');
function masterMd(){
  let out='';
  for(const b of S.books)for(const c of chaptersOf(b))out+='# 《'+b.title+'》'+c.title+'\n\n'+chapterMd(c)+'\n\n';
  return out+usedSources(out).map(s=>'[^'+s.id+']: '+srcLine(s)).join('\n')+'\n';
}
function examMd(e){
  let out='# '+e.name+'\n\n';
  for(const c of examChapters(e))out+='# 《'+bookTitle(c)+'》'+c.title+'\n\n'+e.notes[c.id].md+'\n\n';
  return out+usedSources(out).map(s=>'[^'+s.id+']: '+srcLine(s)).join('\n')+'\n';
}
function refsHtml(text){const u=usedSources(text);return u.length?'<h3>新文獻出處</h3><ol class="refs">'+u.map(s=>'<li id="src-'+s.id+'"><strong>'+esc(s.short)+'</strong><br>'+esc(srcLine(s))+(s.limitations?'<br><span class="src">限制：'+esc(s.limitations)+'</span>':'')+'</li>').join('')+'</ol>':'';}
function chapterHtml(c){return '<p class="src">《'+esc(bookTitle(c))+'》'+(c.pages?'，第 '+esc(c.pages)+' '+(c.unit||'頁'):'')+'</p><h2 id="'+c.id+'">'+esc(c.title)+'</h2>'+c.sections.map(s=>'<section data-akey="m:'+s.id+'"><h3>'+lineMd(s.heading)+'</h3>'+mdRender(s.md)+'</section>').join('');}
function offlineHtml(title,bodyHtml,toc){
  return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+esc(title)+'</title><style>'+$('#noteCss').textContent+'body{margin:0;background:#fff}.wrap{max-width:52rem;margin:0 auto;padding:1.5rem max(1rem,env(safe-area-inset-right)) 4rem max(1rem,env(safe-area-inset-left))}.toc a{display:inline-block;padding:.3rem 0;color:var(--teal-d)}.toc{font-size:.95rem;border-bottom:1px solid var(--line);padding-bottom:1rem;margin-bottom:2.5rem}.doc h2{margin-top:.2rem}.doc p.src{margin-top:3rem}.doc h2+p.src,.doc li p.src{margin-top:0}@media print{.doc{font-size:10.5pt;line-height:1.6}}</style></head><body><div class="wrap doc"><h2 style="margin-top:0">'+esc(title)+'</h2><p class="src">匯出日期 '+today()+'。黃色劃線的行是新文獻補充，行尾是出處。'+((S.annos||[]).length?'綠底是你劃的重點，粉紅底是標為不熟，括號內是你的註記。':'')+'</p>'+(toc?'<div class="toc">'+toc+'</div>':'')+bodyHtml+'</div></body></html>';
}
function exportMaster(kind){
  if(!S.chapters.length){toast('還沒有筆記可以匯出');return;}
  if(kind==='md')return download('婦癌唸書筆記_'+today()+'.md',masterMd(),'text/markdown');
  const chs=allChapters();const body=annotateExport(chs.map(chapterHtml).join(''))+refsHtml(masterMd());
  const toc='<ol>'+chs.map(c=>'<li><a href="#'+c.id+'">'+esc(c.title)+'</a></li>').join('')+'</ol>';
  download('婦癌唸書筆記_'+today()+'.html',offlineHtml('婦癌唸書筆記',body,toc),'text/html');
}
function exportExam(kind){
  const e=getExam();const chs=examChapters(e);
  if(!chs.length){toast('這場考試還沒有產生筆記');return;}
  if(kind==='md')return download(fileSafe(e.name)+'_'+today()+'.md',examMd(e),'text/markdown');
  const body=annotateExport(chs.map(c=>'<p class="src">《'+esc(bookTitle(c))+'》</p><h2 id="'+c.id+'">'+esc(c.title)+'</h2><div data-akey="e:'+e.id+':'+c.id+'">'+mdRender(e.notes[c.id].md)+'</div>').join(''))+refsHtml(examMd(e));
  const toc='<ol>'+chs.map(c=>'<li><a href="#'+c.id+'">'+esc(c.title)+'</a></li>').join('')+'</ol>';
  download(fileSafe(e.name)+'_'+today()+'.html',offlineHtml(e.name,body,toc),'text/html');
}

/* ========== 互動 ========== */

/* ========== 我的記號：選取文字 → 劃重點／不熟／註記 ==========
   記號不寫進筆記內文，而是記住「選到的文字＋前後文」，每次畫面重繪時再找回原處，
   所以重新整理或修改筆記後，只要那段文字還在就會留著。 */
const ANN_CTX=16;
const squash=t=>String(t||'').replace(/\s+/g,'');
function annIndex(root){
  const nodes=[];let pos=0;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&n.parentNode.closest&&n.parentNode.closest('button,textarea,input,.ann-chip,.ann-note')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  while(w.nextNode()){const n=w.currentNode;nodes.push({n,s:pos,e:pos+n.nodeValue.length});pos+=n.nodeValue.length;}
  let norm='';const map=[];
  for(const x of nodes){const v=x.n.nodeValue;for(let i=0;i<v.length;i++)if(!/\s/.test(v[i])){norm+=v[i];map.push(x.s+i);}}
  return {nodes,norm,map};
}
function annLocate(idx,a){
  const q=squash(a.quote);if(!q)return -1;let best=-1,score=-1,i=idx.norm.indexOf(q);
  while(i>=0){
    const pre=idx.norm.slice(Math.max(0,i-ANN_CTX),i),suf=idx.norm.slice(i+q.length,i+q.length+ANN_CTX);let sc=0;
    if(a.pre)sc+=pre.endsWith(a.pre)?2:pre.endsWith(a.pre.slice(-5))?1:0;
    if(a.suf)sc+=suf.startsWith(a.suf)?2:suf.startsWith(a.suf.slice(0,5))?1:0;
    if(sc>score){score=sc;best=i;}
    i=idx.norm.indexOf(q,i+1);
  }
  return best;
}
function annWrap(idx,a,at){
  const q=squash(a.quote),s=idx.map[at],e=idx.map[at+q.length-1]+1;let last=null;
  for(const x of idx.nodes.filter(x=>x.e>s&&x.s<e)){
    let n=x.n;const a0=Math.max(s,x.s)-x.s,b0=Math.min(e,x.e)-x.s;
    if(b0<n.nodeValue.length)n.splitText(b0);
    if(a0>0)n=n.splitText(a0);
    if(!n.nodeValue.trim())continue;
    const m=n.ownerDocument.createElement('mark');m.className='ann'+(a.star?' star':'');m.dataset.anno=a.id;if(a.note)m.title=a.note;
    n.parentNode.insertBefore(m,n);m.appendChild(n);last=m;
  }
  return last;
}
function applyAnnos(root,mode){
  const list=S.annos||[];if(!list.length||!root)return;
  for(const el of root.querySelectorAll('[data-akey]')){
    for(const a of list.filter(a=>a.key===el.dataset.akey)){
      const idx=annIndex(el),at=annLocate(idx,a);if(at<0)continue;
      const last=annWrap(idx,a,at);if(!last||!a.note)continue;
      const c=el.ownerDocument.createElement(mode==='export'?'span':'sup');
      if(mode==='export'){c.className='ann-note';c.textContent='（註：'+a.note+'）';}else{c.className='ann-chip';c.dataset.anno=a.id;c.textContent='註';c.title=a.note;}
      last.after(c);
    }
  }
}
function annotateExport(html){const d=document.createElement('div');d.innerHTML=html;applyAnnos(d,'export');return d.innerHTML;}
let ANNSEL=null,annT=null;
function readSelection(){
  const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0);const el=c=>(c.nodeType===1?c:c.parentElement);
  const box=el(r.startContainer)?.closest('[data-akey]');if(!box||box!==el(r.endContainer)?.closest('[data-akey]'))return null;
  if(el(r.startContainer).closest('textarea,input,button'))return null;
  const quote=sel.toString().trim();if(!squash(quote)||quote.length>800)return null;
  const idx=annIndex(box),q=squash(quote);let at=-1;
  if(r.startContainer.nodeType===3){const x=idx.nodes.find(x=>x.n===r.startContainer);if(x){const raw=x.s+r.startOffset;let k=idx.map.findIndex(m=>m>=raw);if(k>=0&&idx.norm.substr(k,q.length)===q)at=k;}}
  if(at<0)at=idx.norm.indexOf(q);if(at<0)return null;
  return {key:box.dataset.akey,quote,pre:idx.norm.slice(Math.max(0,at-ANN_CTX),at),suf:idx.norm.slice(at+q.length,at+q.length+ANN_CTX)};
}

/* ========== 複習：一張一張看不熟、重點、心得、口訣、快速複習 ========== */
const _tx=document.createElement('div');
const textOf=h=>{_tx.innerHTML=h;return _tx.textContent;};
const lineText=l=>isTableSep(l)?'':(isTableRow(l)?cells(l).map(c=>textOf(lineMd(c))).join(''):textOf(mdRender(l)));
const _secCache=new Map();
function secIndex(s){
  const k=s.id+'|'+s.md.length;if(_secCache.has(k))return _secCache.get(k);
  const L=s.md.split('\n');let norm='';const owner=[];
  const add=(t,o)=>{for(const ch of t)if(!/\s/.test(ch)){norm+=ch;owner.push(o);}};
  add(textOf(lineMd(s.heading)),-1);L.forEach((l,i)=>add(lineText(l),i));
  const r={L,norm,owner};_secCache.set(k,r);return r;
}
function annLines(a){
  const m=a.key.match(/^m:(C\d+)\./);if(!m)return null;const c=getCh(m[1]);const s=c&&c.sections.find(x=>'m:'+x.id===a.key);if(!s)return null;
  const ix=secIndex(s),at=annLocate({norm:ix.norm},a);if(at<0)return {c,s,md:''};
  const ls=[...new Set(ix.owner.slice(at,at+squash(a.quote).length))].sort((x,y)=>x-y);
  if(ls.length===1&&ls[0]===-1)return {c,s,md:'#### '+s.heading};
  const L=ix.L;const keep=new Set(ls.filter(x=>x>=0));
  for(const li of [...keep]){if(isTableRow(L[li])){let k=li;while(k>0&&(isTableRow(L[k-1])||isTableSep(L[k-1])))k--;keep.add(k);if(isTableSep(L[k+1]||''))keep.add(k+1);}}
  const arr=[...keep].sort((x,y)=>x-y);const base=Math.min(...arr.map(i=>RE_LIST.test(L[i])?L[i].match(/^\s*/)[0].length:0));
  return {c,s,md:arr.map(i=>RE_LIST.test(L[i])?L[i].slice(base):L[i]).join('\n')};
}
function mnemonicCards(){
  const seen=new Set(),out=[];
  const scan=(md,c,where)=>{const L=md.split('\n');for(let i=0;i<L.length;i++)if(/^>\s*\*\*口訣/.test(L[i])){const t=L[i].replace(/\s+/g,'');if(seen.has(t))continue;seen.add(t);out.push({kind:'mn',c,where,md:L[i]+'\n'+(L[i+1]&&/^>/.test(L[i+1])?L[i+1]:'')});}};
  for(const c of allChapters()){for(const s of c.sections)scan(s.md,c,'母本');for(const e of S.exams){const n=e.notes[c.id];if(n)scan(n.md,c,e.name);}}
  return out;
}
function qrCards(){
  const out=[];
  for(const e of S.exams)for(const c of allChapters()){const n=e.notes[c.id];if(!n)continue;const m=n.md.match(/(^|\n)## 快速複習\n([\s\S]*?)(\n## |$)/);if(!m)continue;
    for(const l of m[2].split('\n'))if(/^\s*-\s+/.test(l))out.push({kind:'qr',c,where:e.name,md:l.trim()});}
  return out;
}
function revBuild(){
  const r=UI.rev,chs=allChapters(),order=new Map(chs.map((c,i)=>[c.id,i]));let list=[];
  if(r.type==='mn')list=mnemonicCards();
  else if(r.type==='qr')list=qrCards();
  else{
    const keyOrder=a=>{const m=a.key.match(/^m:(C\d+)\.(\d+)$/);return m?order.get(m[1])*1000+(+m[2]):1e9;};
    list=(S.annos||[]).filter(a=>a.key.startsWith('m:')&&(r.type==='all'||(r.type==='st'&&a.star)||(r.type==='hl'&&!a.star)||(r.type==='note'&&a.note)))
      .map(a=>({kind:a.star?'st':'hl',a,c:getCh(a.key.match(/^m:(C\d+)\./)?.[1]),k:keyOrder(a)})).sort((x,y)=>x.k-y.k);
  }
  if(r.ch)list=list.filter(x=>x.c&&x.c.id===r.ch);
  if(r.order==='rand'){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}}
  r.list=list;r.i=Math.min(r.i,Math.max(0,list.length-1));
}
const REV_TYPES=[['st','不熟'],['hl','重點'],['note','我的心得'],['mn','口訣'],['qr','快速複習'],['all','全部標記']];

function pgCycle(k){S.progress=S.progress||{};const v=(pgGet(k)+1)%3;if(v)S.progress[k]=v;else delete S.progress[k];save();
  $$('[data-pkey="'+CSS.escape(k)+'"]').forEach(b=>{b.className='pg p'+v;b.textContent=PG_LABEL[v];b.closest('li')?.classList.toggle('p2',v===2);});

  saveCfg:()=>{CFG.apiKey=$('#cfKey').value.trim();CFG.model=$('#cfModel').value.trim()||'gemini-3.1-pro-preview';CFG.thinking=$('#cfThink').value;CFG.level=$('#cfLevel').value;OKMODEL=null;saveCfg();toast('設定已儲存');},
  testKey:async()=>{ACT.saveCfg();const out=$('#cfOut');out.textContent='連線中…';try{const ctrl=new AbortController();const r=await gemini({parts:[{text:'只回覆兩個字：正常'}],thinking:'low',signal:ctrl.signal});out.textContent='連線正常。實際使用的模型：'+r.model;}catch(e){out.textContent=e.message;}},
  listModels:async()=>{ACT.saveCfg();const out=$('#cfOut');out.textContent='查詢中…';try{const res=await fetch(API+'/models?pageSize=200',{headers:{'x-goog-api-key':CFG.apiKey}});if(!res.ok)throw new Error('查詢失敗 '+res.status+'：'+(await apiError(res)).slice(0,200));const j=await res.json();const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).filter(n=>/gemini/.test(n)&&!/image|tts|audio|embedding|live/.test(n));$('#models').innerHTML=names.map(n=>'<option value="'+esc(n)+'">').join('');out.textContent=names.length?'這把 key 可用的模型：'+names.join('、'):'這把 key 沒有可用的 Gemini 模型';}catch(e){out.textContent=e.message;}},
  backup:()=>download('婦癌唸書筆記_備份_'+today()+'.json',JSON.stringify({app:'gynonc-study-notes',v:1,state:S}),'application/json'),
  restore:()=>pick('.json',false,async fs=>{try{const j=JSON.parse(await fs[0].text());const st=j.state||j;if(!Array.isArray(st.chapters)||!st.seq)throw new Error('x');if(S.chapters.length&&!confirm('還原會取代目前這台裝置上的筆記（'+S.chapters.length+' 章）。'+((S.annos||[]).length?'備份檔裡若沒有記號，會保留你現在的 '+S.annos.length+' 個記號；若備份檔有記號，則以備份檔為準。':'')+'確定？'))return;const keep=(!st.annos||!st.annos.length)&&(S.annos||[]).length?S.annos:null;const keepP=(!st.progress||!Object.keys(st.progress).length)&&Object.keys(S.progress||{}).length?S.progress:null;S=Object.assign(blank(),st);if(keep)S.annos=keep;if(keepP)S.progress=keepP;UI.chapterId=null;UI.examId=null;save();toast('已還原 '+S.chapters.length+' 章筆記'+(keep?'，保留你原本的 '+keep.length+' 個記號':''));go('notes');}catch(e){toast('這不是有效的備份檔');}}),
  wipe:()=>{if(!confirm('清除這台裝置上的所有筆記、文獻與考試筆記？這個動作無法復原，建議先下載備份。'))return;S=blank();UI.chapterId=null;UI.examId=null;save();renderSet();toast('已清除');}
};
document.addEventListener('click',e=>{
  const im=e.target.closest('figure.bookfig img');
  if(im){const d=$('#dlg');d.innerHTML='<div style="overflow:auto;max-height:78vh"><img src="'+im.src+'" alt="" style="max-width:none;width:100%;min-width:'+Math.min(im.naturalWidth,1000)+'px"></div><p class="small muted" style="margin:.6rem 0">'+esc(im.alt)+'</p><p class="row"><button class="btn pri" data-act="closeDlg">關閉</button></p>';d.style.maxWidth='min(64rem,96vw)';d.showModal();d.addEventListener('close',()=>{d.style.maxWidth='';},{once:true});return;}
  const mk=e.target.closest('mark.ann,.ann-chip');
  if(mk&&getSelection().isCollapsed){const a=(S.annos||[]).find(x=>x.id===mk.dataset.anno);if(a){annEdit(a,false);return;}}
  const cite=e.target.closest('a.cite');if(cite){e.preventDefault();showSrc(cite.dataset.src);return;}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.matches('.drop')&&e.target.closest('a,button:not(.drop)'))return;
  ACT[b.dataset.act]?.(b,e);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.drop')){e.preventDefault();e.target.click();}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;renderTree();renderPane();}
  else if(t.matches('.lit-text')){getQ(t.dataset.lit).result.items[+t.dataset.i].text=t.value;}
  else if(t.matches('.lit-short')){getQ(t.dataset.lit).result.citation.short=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='onlyNew'){UI.onlyNew=t.checked;renderPane();}
  else if(t.matches('.evToggle')){CFG.hideEv=!t.checked;saveCfg();document.body.classList.toggle('hide-ev',!!CFG.hideEv);$$('.evToggle').forEach(x=>x.checked=t.checked);}
  else if(t.matches('.lit-on')){getQ(t.dataset.lit).result.items[+t.dataset.i].on=t.checked;}
  else if(t.matches('.lit-ch')){const it=getQ(t.dataset.lit).result.items[+t.dataset.i];it.chapterId=t.value;it.sectionId='';it.anchor='';paintLit();}
  else if(t.matches('.lit-sec')){const it=getQ(t.dataset.lit).result.items[+t.dataset.i];it.sectionId=t.value;it.anchor='';}
  else if(t.id==='exSel'){readExamForm();UI.examId=t.value;UI.examCh='';renderExam();}
  else if(t.id==='revType'||t.id==='revCh'||t.id==='revOrder'){UI.rev[{revType:'type',revCh:'ch',revOrder:'order'}[t.id]]=t.value;UI.rev.i=0;revBuild();renderRev();}
  else if(t.id==='exCh'){UI.examCh=t.value;renderExam();$('#exNotes')?.scrollIntoView();}
  else if(t.id==='exNew'&&t.value){readExamForm();const e2=newExam(t.value==='__blank'?'':t.value);UI.examId=e2.id;save();renderExam();}
  else if(t.matches('#exName,#exScope,#exLevel,.ex-f,.ex-c')){readExamForm();}
  else if(t.name==='bkMode'){BK.mode=t.value;}
});
for(const ev of ['dragenter','dragover'])document.addEventListener(ev,e=>{const d=e.target.closest?.('.drop');if(d){e.preventDefault();d.classList.add('over');}else if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});
document.addEventListener('dragleave',e=>{e.target.closest?.('.drop')?.classList.remove('over');});
document.addEventListener('drop',e=>{
  if(!e.dataTransfer?.files?.length)return;e.preventDefault();
  const d=e.target.closest?.('.drop');$$('.drop').forEach(x=>x.classList.remove('over'));
  const files=[...e.dataTransfer.files];
  if(d?.id==='dropBook')loadBookFile(files[0]);else if(d?.id==='dropLit')addLitFiles(files);else toast('請把檔案放進虛線框裡');
});
window.addEventListener('beforeunload',e=>{if(JOB.ctrl){e.preventDefault();e.returnValue='';}});

(async function init(){
  document.body.classList.toggle('hide-ev',!!CFG.hideEv);
  await DB.open();
  const st=await DB.get('state');if(st&&Array.isArray(st.chapters))S=Object.assign(blank(),st);
  go('notes');
})();
</script>
</body>
</html>
